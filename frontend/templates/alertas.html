<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Alertas - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Central de Alertas</h1>
      <p>Fique por dentro dos produtos que precisam de atencao.</p>
    </div>
  </div>

  <ul class="nav nav-pills mb-3" id="tabs-alertas">
    <li class="nav-item"><button class="nav-link active" data-filter="nao-lidos">Nao lidos</button></li>

    <li class="nav-item"><button class="nav-link" data-filter="todos">Todos</button></li>
  </ul>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <div id="vs-alertas-list" class="d-none"></div>
</div>

<div id="vs-bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
