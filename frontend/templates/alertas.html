<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Alertas - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Central de Alertas</h1>
      <p>Fique por dentro dos produtos que precisam de atencao.</p>
    </div>
  </div>

  <div id="vs-push-banner" class="vs-card mb-3 d-none d-flex align-items-center gap-3">
    <span data-vs-icon="bell" data-vs-icon-size="20" style="color:var(--vs-primary-600);flex-shrink:0;"></span>
    <div class="flex-grow-1">
      <div class="fw-semibold small">Ativar notificacoes neste aparelho</div>
      <div class="vs-muted" style="font-size:0.8rem;">Receba um aviso na tela assim que um produto estiver vencendo, mesmo com o site fechado.</div>
    </div>
    <button class="btn btn-sm btn-vs-primary" id="btn-ativar-push">Ativar</button>
  </div>

  <ul class="nav nav-pills mb-3" id="tabs-alertas">
    <li class="nav-item"><button class="nav-link active" data-filter="nao-lidos">Nao lidos</button></li>
    <li class="nav-item"><button class="nav-link" data-filter="lidos">Lidos</button></li>
    <li class="nav-item"><button class="nav-link" data-filter="todos">Todos</button></li>
  </ul>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <!-- Mobile: cards -->
  <div id="vs-alertas-list" class="d-lg-none d-none"></div>

  <!-- Desktop: table -->
  <div class="vs-table-wrap d-none d-lg-block">
    <table class="vs-table" id="vs-alertas-table">
      <thead>
        <tr>
          <th>Alerta</th>
          <th>Produto</th>
          <th>Data</th>
          <th>Status</th>
          <th>Acoes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="vs-bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/alertas.js"></script>
</body>
</html>
