<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Historico - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Historico</h1>
      <p>Acompanhe as acoes realizadas no seu estabelecimento.</p>
    </div>
  </div>

  <div class="vs-filter-bar">
    <select class="form-select" style="max-width:220px;" id="filtro-entidade">
      <option value="">Todas as entidades</option>
      <option value="produto">Produtos</option>
      <option value="lote">Lotes</option>
      <option value="perda">Perdas</option>
      <option value="categoria">Categorias</option>
      <option value="fornecedor">Fornecedores</option>
      <option value="localizacao">Localizacoes</option>
      <option value="usuario">Usuarios</option>
      <option value="empresa">Empresa</option>
      <option value="configuracao">Configuracoes</option>
    </select>
  </div>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>
  <!-- Mobile: cards -->
  <div id="vs-lista" class="d-lg-none d-none"></div>

  <!-- Desktop: table -->
  <div class="vs-table-wrap d-none d-lg-block">
    <table class="vs-table" id="vs-historico-table">
      <thead>
        <tr>
          <th>Acao</th>
          <th>Usuario</th>
          <th>Data/hora</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="vs-bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/historico.js"></script>
</body>
</html>
