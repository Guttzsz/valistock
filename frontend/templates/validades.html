<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Validades - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Validades</h1>
      <p>Acompanhe todos os lotes e seus prazos de vencimento.</p>
    </div>
  </div>

  <div class="vs-filter-bar">
    <div class="d-flex flex-wrap gap-2" id="filtro-status">
      <input type="radio" class="btn-check" name="status" id="f-todos" value="" checked>
      <label class="btn btn-outline-secondary btn-sm rounded-pill" for="f-todos">Todos</label>

      <input type="radio" class="btn-check" name="status" id="f-normal" value="normal">
      <label class="btn btn-outline-secondary btn-sm rounded-pill" for="f-normal">Normal</label>

      <input type="radio" class="btn-check" name="status" id="f-atencao" value="atencao">
      <label class="btn btn-outline-secondary btn-sm rounded-pill" for="f-atencao">Atencao</label>

      <input type="radio" class="btn-check" name="status" id="f-urgente" value="urgente">
      <label class="btn btn-outline-secondary btn-sm rounded-pill" for="f-urgente">Urgente</label>

      <input type="radio" class="btn-check" name="status" id="f-hoje" value="vence_hoje">
      <label class="btn btn-outline-secondary btn-sm rounded-pill" for="f-hoje">Vence hoje</label>

      <input type="radio" class="btn-check" name="status" id="f-vencido" value="vencido">
      <label class="btn btn-outline-secondary btn-sm rounded-pill" for="f-vencido">Vencidos</label>
    </div>
  </div>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <!-- Mobile: cards -->
  <div id="vs-validades-cards" class="d-lg-none d-none"></div>

  <!-- Desktop: table -->
  <div class="vs-table-wrap d-none d-lg-block">
    <table class="vs-table" id="vs-validades-table">
      <thead>
        <tr>
          <th>Produto</th>
          <th>Codigo</th>
          <th>Lote</th>
          <th>Qtd</th>
          <th>Validade</th>
          <th>Dias</th>
          <th>Valor em risco</th>
          <th>Status</th>
          <th>Acoes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="vs-bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/validades.js"></script>
</body>
</html>
