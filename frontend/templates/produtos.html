<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Produtos - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Produtos</h1>
      <p>Cadastre produtos e gerencie seus lotes.</p>
    </div>
    <button class="btn btn-vs-primary" data-bs-toggle="modal" data-bs-target="#modal-produto" id="btn-novo-produto">+ Novo produto</button>
  </div>

  <div class="vs-filter-bar">
    <input type="search" class="form-control vs-search" id="busca" placeholder="Buscar por nome ou codigo de barras...">
    <select class="form-select" style="max-width:200px;" id="filtro-categoria">
      <option value="">Todas categorias</option>
    </select>
  </div>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <div id="vs-produtos-list" class="d-none"></div>
</div>

<button class="vs-fab" id="btn-fab-scan" title="Escanear codigo de barras" data-vs-icon="camera" data-vs-icon-size="24"></button>
<div id="vs-bottom-nav"></div>

<!-- Modal: Produto -->
<div class="modal fade" id="modal-produto" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-produto-title">Novo produto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-produto">
        <div class="modal-body">
          <input type="hidden" id="produto-id">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Nome *</label>
            <input type="text" class="form-control" id="produto-nome" required>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Codigo de barras</label>
            <div class="input-group">
              <input type="text" class="form-control" id="produto-codigo-barras">
              <button class="btn btn-outline-secondary" type="button" id="btn-scan-produto" data-vs-icon="camera" data-vs-icon-size="16"></button>
            </div>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label small fw-semibold">Categoria</label>
              <select class="form-select" id="produto-categoria">
                <option value="">Sem categoria</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Unidade</label>
              <input type="text" class="form-control" id="produto-unidade" value="UN">
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label class="form-label small fw-semibold">Marca</label>
              <input type="text" class="form-control" id="produto-marca">
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Fornecedor</label>
              <select class="form-select" id="produto-fornecedor">
                <option value="">Sem fornecedor</option>
              </select>
            </div>
          </div>
          <div class="mt-2">
            <label class="form-label small fw-semibold">Localizacao na loja</label>
            <select class="form-select" id="produto-localizacao">
              <option value="">Sem localizacao</option>
            </select>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label class="form-label small fw-semibold">Preco de custo (R$)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="produto-preco-custo" value="0">
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Preco de venda (R$)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="produto-preco-venda" value="0">
            </div>
          </div>
          <div class="mt-2">
            <label class="form-label small fw-semibold">Estoque minimo</label>
            <input type="number" min="0" class="form-control" id="produto-estoque-minimo" value="0">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-vs-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Escanear codigo de barras -->
<div class="modal fade" id="modal-scan" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Escanear codigo de barras</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="scan-reader" class="vs-scan-reader"></div>
        <p class="vs-muted small text-center mt-2 mb-0" id="scan-status">Aponte a camera para o codigo de barras.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Novo lote -->
<div class="modal fade" id="modal-lote" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Adicionar lote - <span id="lote-produto-nome"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-lote">
        <div class="modal-body">
          <input type="hidden" id="lote-produto-id">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Numero do lote *</label>
            <input type="text" class="form-control" id="lote-numero" required placeholder="Ex: LT001">
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label small fw-semibold">Quantidade *</label>
              <input type="number" min="1" class="form-control" id="lote-quantidade" required>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Custo unitario (R$) *</label>
              <input type="number" step="0.01" min="0" class="form-control" id="lote-custo" required>
            </div>
          </div>
          <div class="mt-2">
            <label class="form-label small fw-semibold">Data de validade *</label>
            <input type="date" class="form-control" id="lote-validade" required>
            <div class="form-text">Confirme a data reconhecida por OCR antes de salvar, se aplicavel.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-vs-primary">Salvar lote</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/produtos.js"></script>
</body>
</html>
