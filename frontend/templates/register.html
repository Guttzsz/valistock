<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Criar conta - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div class="vs-auth-wrap">
  <div class="vs-auth-card" style="max-width:460px;">
    <div class="vs-auth-logo">
      <div class="vs-brand-mark" style="width:52px;height:52px;font-size:1.2rem;">VS</div>
      <div>
        <div style="font-weight:800;font-size:1.3rem;">Crie sua conta</div>
        <div class="vs-muted" style="font-size:0.85rem;">Comece a controlar suas validades hoje</div>
      </div>
    </div>

    <div id="vs-alert" class="alert alert-danger d-none" role="alert"></div>

    <form id="register-form">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Nome do estabelecimento</label>
        <input type="text" class="form-control" id="empresa_nome_fantasia" placeholder="Ex: Mercado Sao Joao" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email do estabelecimento</label>
        <input type="email" class="form-control" id="empresa_email" required>
      </div>
      <hr class="my-3">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Seu nome</label>
        <input type="text" class="form-control" id="admin_nome" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Seu email (login)</label>
        <input type="email" class="form-control" id="admin_email" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Senha</label>
        <input type="password" class="form-control" id="admin_senha" minlength="8" required autocomplete="new-password">
        <div class="form-text">Minimo de 8 caracteres.</div>
      </div>
      <button type="submit" class="btn btn-vs-primary btn-lg w-100" id="submit-btn">Criar conta</button>
    </form>

    <p class="text-center small vs-muted mt-3 mb-0">
      Ja tem conta? <a href="login.html">Entrar</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script>
  if (Auth.isAuthenticated()) window.location.href = "dashboard.html";

  const form = document.getElementById("register-form");
  const alertBox = document.getElementById("vs-alert");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.add("d-none");
    submitBtn.disabled = true;
    submitBtn.classList.add("is-loading");

    try {
      const data = await Api.register({
        empresa_nome_fantasia: document.getElementById("empresa_nome_fantasia").value.trim(),
        empresa_email: document.getElementById("empresa_email").value.trim(),
        admin_nome: document.getElementById("admin_nome").value.trim(),
        admin_email: document.getElementById("admin_email").value.trim(),
        admin_senha: document.getElementById("admin_senha").value,
      });
      Auth.setSession(data.access_token, data.usuario);
      VsTheme.sincronizarComUsuario(data.usuario);
      window.location.href = "onboarding.html";
    } catch (err) {
      alertBox.textContent = err.message || "Nao foi possivel criar a conta.";
      alertBox.classList.remove("d-none");
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove("is-loading");
    }
  });
</script>
</body>
</html>
