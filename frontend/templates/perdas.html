<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Perdas - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Controle de Perdas</h1>
      <p>Registre e acompanhe os produtos perdidos.</p>
    </div>
    <button class="btn btn-vs-primary" data-bs-toggle="modal" data-bs-target="#modal-perda">+ Registrar perda</button>
  </div>

  <div class="vs-filter-bar">
    <select class="form-select" style="max-width:180px;" id="filtro-periodo">
      <option value="">Todo periodo</option>
      <option value="hoje">Hoje</option>
      <option value="7">Ultimos 7 dias</option>
      <option value="30" selected>Ultimos 30 dias</option>
      <option value="90">Ultimos 90 dias</option>
    </select>
    <select class="form-select" style="max-width:220px;" id="filtro-motivo">
      <option value="">Todos os motivos</option>
      <option value="produto_vencido">Produto vencido</option>
      <option value="produto_danificado">Produto danificado</option>
      <option value="armazenamento_inadequado">Armazenamento inadequado</option>
      <option value="erro_de_estoque">Erro de estoque</option>
      <option value="outro">Outro</option>
    </select>
  </div>

  <div class="vs-card mb-3">
    <div class="vs-kpi-label">Total no periodo</div>
    <div class="vs-kpi-value" id="total-periodo" style="color:var(--vs-vence-hoje);">-</div>
  </div>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <!-- Mobile: cards -->
  <div id="vs-perdas-list" class="d-lg-none d-none"></div>

  <!-- Desktop: table -->
  <div class="vs-table-wrap d-none d-lg-block">
    <table class="vs-table" id="vs-perdas-table">
      <thead>
        <tr>
          <th>Produto</th>
          <th>Motivo</th>
          <th>Data</th>
          <th>Usuario</th>
          <th>Qtd</th>
          <th>Valor unit.</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="vs-bottom-nav"></div>

<!-- Modal: Registrar perda -->
<div class="modal fade" id="modal-perda" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Registrar perda</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-perda">
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Produto *</label>
            <select class="form-select" id="perda-produto" required></select>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Lote (opcional)</label>
            <select class="form-select" id="perda-lote">
              <option value="">Sem lote especifico</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Quantidade *</label>
            <input type="number" min="1" class="form-control" id="perda-quantidade" required>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Motivo *</label>
            <select class="form-select" id="perda-motivo" required>
              <option value="produto_vencido">Produto vencido</option>
              <option value="produto_danificado">Produto danificado</option>
              <option value="armazenamento_inadequado">Armazenamento inadequado</option>
              <option value="erro_de_estoque">Erro de estoque</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Observacao</label>
            <textarea class="form-control" id="perda-observacao" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-vs-primary">Registrar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/perdas.js"></script>
</body>
</html>
