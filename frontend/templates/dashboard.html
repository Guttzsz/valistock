<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1 id="vs-greeting">Ola!</h1>
      <p>Aqui esta o resumo do seu estabelecimento hoje.</p>
    </div>
  </div>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <div id="vs-dashboard-content" class="d-none">
    <div class="vs-kpi-grid">
      <div class="vs-kpi">
        <div class="vs-kpi-label" data-vs-icon="box">Produtos cadastrados</div>
        <div class="vs-kpi-value" id="kpi-produtos">-</div>
      </div>
      <div class="vs-kpi risk">
        <div class="vs-kpi-label" data-vs-icon="clock">Proximos do vencimento</div>
        <div class="vs-kpi-value" id="kpi-proximos">-</div>
      </div>
      <div class="vs-kpi danger">
        <div class="vs-kpi-label" data-vs-icon="xCircle">Vencidos</div>
        <div class="vs-kpi-value" id="kpi-vencidos">-</div>
      </div>
      <div class="vs-kpi risk">
        <div class="vs-kpi-label" data-vs-icon="dollar">Valor em risco</div>
        <div class="vs-kpi-value" id="kpi-valor-risco">-</div>
      </div>
      <div class="vs-kpi danger">
        <div class="vs-kpi-label" data-vs-icon="trendingDown">Perdas do mes</div>
        <div class="vs-kpi-value" id="kpi-perdas-mes">-</div>
      </div>
      <div class="vs-kpi good">
        <div class="vs-kpi-label" data-vs-icon="checkCircle">Economia potencial</div>
        <div class="vs-kpi-value" id="kpi-economia">-</div>
      </div>
    </div>

    <div class="vs-card mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Produtos mais urgentes</h2>
        <a href="validades.html" class="small">Ver todos →</a>
      </div>
      <div id="vs-urgentes-list"></div>
    </div>

    <div class="vs-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Alertas nao lidos</h2>
        <a href="alertas.html" class="small">Ver todos →</a>
      </div>
      <div id="vs-alertas-list"></div>
    </div>
  </div>
</div>

<div id="vs-bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/dashboard.js"></script>
</body>
</html>
