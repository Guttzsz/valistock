<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Usuarios - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Usuarios</h1>
      <p>Gerencie quem tem acesso ao ValiStock.</p>
    </div>
    <button class="btn btn-vs-primary" data-bs-toggle="modal" data-bs-target="#modal-usuario">+ Novo usuario</button>
  </div>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <div id="vs-usuarios-list" class="d-none"></div>
</div>

<div id="vs-bottom-nav"></div>

<div class="modal fade" id="modal-usuario" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Novo usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-usuario">
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Nome *</label>
            <input type="text" class="form-control" id="usuario-nome" required>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Email *</label>
            <input type="email" class="form-control" id="usuario-email" required>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Senha *</label>
            <input type="password" class="form-control" id="usuario-senha" minlength="8" required>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Cargo</label>
            <input type="text" class="form-control" id="usuario-cargo">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Perfil *</label>
            <select class="form-select" id="usuario-perfil">
              <option value="funcionario">Funcionario</option>
              <option value="gerente">Gerente</option>
              <option value="administrador">Administrador</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-vs-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/usuarios.js"></script>
</body>
</html>
