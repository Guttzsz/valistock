<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Configuracoes - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Configuracoes</h1>
      <p>Ajuste os prazos de alerta e os dados do seu estabelecimento.</p>
    </div>
  </div>

  <div class="vs-card mb-3">
    <h2 class="h6 mb-3">Prazos de alerta de vencimento</h2>
    <form id="form-config">
      <div class="row g-2">
        <div class="col-4">
          <label class="form-label small fw-semibold">1º aviso (dias antes)</label>
          <input type="number" min="1" class="form-control" id="dias-alerta-1">
        </div>
        <div class="col-4">
          <label class="form-label small fw-semibold">2º aviso (dias antes)</label>
          <input type="number" min="1" class="form-control" id="dias-alerta-2">
        </div>
        <div class="col-4">
          <label class="form-label small fw-semibold">3º aviso (dias antes)</label>
          <input type="number" min="1" class="form-control" id="dias-alerta-3">
        </div>
      </div>
      <button type="submit" class="btn btn-vs-primary mt-3">Salvar prazos</button>
    </form>
  </div>

  <div class="vs-card">
    <h2 class="h6 mb-3">Dados do estabelecimento</h2>
    <form id="form-empresa">
      <div class="mb-2">
        <label class="form-label small fw-semibold">Nome fantasia</label>
        <input type="text" class="form-control" id="empresa-nome">
      </div>
      <div class="mb-2">
        <label class="form-label small fw-semibold">Razao social</label>
        <input type="text" class="form-control" id="empresa-razao">
      </div>
      <div class="row g-2">
        <div class="col-6">
          <label class="form-label small fw-semibold">CNPJ</label>
          <input type="text" class="form-control" id="empresa-cnpj">
        </div>
        <div class="col-6">
          <label class="form-label small fw-semibold">Telefone</label>
          <input type="text" class="form-control" id="empresa-telefone">
        </div>
      </div>
      <div class="mb-2 mt-2">
        <label class="form-label small fw-semibold">Endereco</label>
        <input type="text" class="form-control" id="empresa-endereco">
      </div>
      <div class="row g-2">
        <div class="col-8">
          <label class="form-label small fw-semibold">Cidade</label>
          <input type="text" class="form-control" id="empresa-cidade">
        </div>
        <div class="col-4">
          <label class="form-label small fw-semibold">Estado (UF)</label>
          <input type="text" maxlength="2" class="form-control" id="empresa-estado">
        </div>
      </div>
      <button type="submit" class="btn btn-vs-primary mt-3">Salvar dados</button>
    </form>
  </div>
</div>

<div id="vs-bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/configuracoes.js"></script>
</body>
</html>
