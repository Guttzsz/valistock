<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Recuperar senha - ValiStock</title>
<link rel="manifest" href="/manifest.json" id="vs-manifest-link">
<meta name="theme-color" content="#16a34a">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ValiStock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/static/js/pwa.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div class="vs-auth-wrap vs-auth-wrap--ambient">
  <div class="vs-auth-card">
    <div class="vs-auth-logo">
      <div class="vs-brand-mark vs-brand-mark--hero"></div>
      <div>
        <h1 class="vs-auth-title">Recuperar senha</h1>
        <p class="vs-auth-subtitle">Enviamos um link para criar uma senha nova.</p>
      </div>
    </div>

    <div id="vs-alert" class="alert alert-danger d-none" role="alert"></div>

    <div id="pedido-step">
      <form id="esqueci-form">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email da sua conta</label>
          <div class="vs-input-icon">
            <span class="vs-input-icon-glyph" data-vs-icon="mail" data-vs-icon-size="16"></span>
            <input type="email" class="form-control form-control-lg" id="email" required autocomplete="username" autofocus>
          </div>
        </div>
        <button type="submit" class="btn btn-vs-primary btn-lg w-100" id="submit-btn">Enviar link</button>
      </form>
    </div>

    <div id="enviado-step" class="d-none text-center">
      <p class="fw-semibold mb-1">Verifique seu e-mail</p>
      <p class="small vs-muted mb-0">Se esse e-mail estiver cadastrado, enviamos um link para criar uma nova senha. Ele vale por 1 hora. Confira também a caixa de spam.</p>
    </div>

    <p class="text-center small mt-4 mb-0"><a href="login.html">Voltar para o login</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/cookie-consent.js"></script>
<script>
  if (Auth.isAuthenticated()) window.location.href = "dashboard.html";
  VsApplyBrandMarks();
  if (typeof VsApplyIcons === "function") VsApplyIcons();

  const form = document.getElementById("esqueci-form");
  const alertBox = document.getElementById("vs-alert");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.add("d-none");
    submitBtn.disabled = true;
    submitBtn.classList.add("is-loading");
    try {
      await Api.esqueciSenha(document.getElementById("email").value.trim());
      document.getElementById("pedido-step").classList.add("d-none");
      document.getElementById("enviado-step").classList.remove("d-none");
    } catch (err) {
      alertBox.textContent = err.message || "Nao foi possivel enviar o link. Tente novamente.";
      alertBox.classList.remove("d-none");
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove("is-loading");
    }
  });
</script>
</body>
</html>
