<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Nova senha - ValiStock</title>
<link rel="manifest" href="/manifest.json" id="vs-manifest-link">
<meta name="theme-color" content="#16a34a">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ValiStock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/static/js/pwa.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div class="vs-auth-wrap vs-auth-wrap--ambient">
  <div class="vs-auth-card">
    <div class="vs-auth-logo">
      <div class="vs-brand-mark vs-brand-mark--hero"></div>
      <div>
        <h1 class="vs-auth-title">Criar nova senha</h1>
        <p class="vs-auth-subtitle">Escolha uma senha forte para a sua conta.</p>
      </div>
    </div>

    <div id="vs-alert" class="alert alert-danger d-none" role="alert"></div>

    <div id="form-step">
      <form id="redefinir-form">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Nova senha</label>
          <div class="vs-input-icon">
            <span class="vs-input-icon-glyph" data-vs-icon="lock" data-vs-icon-size="16"></span>
            <input type="password" class="form-control form-control-lg" id="senha" minlength="8" required autocomplete="new-password" autofocus>
          </div>
          <div class="form-text">Mínimo de 8 caracteres, com letras e números.</div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Repita a nova senha</label>
          <div class="vs-input-icon">
            <span class="vs-input-icon-glyph" data-vs-icon="lock" data-vs-icon-size="16"></span>
            <input type="password" class="form-control form-control-lg" id="senha2" minlength="8" required autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="btn btn-vs-primary btn-lg w-100" id="submit-btn">Salvar nova senha</button>
      </form>
    </div>

    <div id="ok-step" class="d-none text-center">
      <p class="fw-semibold mb-1">Senha alterada!</p>
      <p class="small vs-muted mb-3">Agora você já pode entrar com a senha nova.</p>
      <a href="login.html" class="btn btn-vs-primary btn-lg w-100">Ir para o login</a>
    </div>

    <div id="invalido-step" class="d-none text-center">
      <p class="fw-semibold mb-1">Link inválido ou expirado</p>
      <p class="small vs-muted mb-3">Cada link vale por 1 hora e só pode ser usado uma vez.</p>
      <a href="esqueci-senha.html" class="btn btn-vs-primary btn-lg w-100">Pedir um novo link</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/cookie-consent.js"></script>
<script>
  VsApplyBrandMarks();
  if (typeof VsApplyIcons === "function") VsApplyIcons();
  VsWirePasswordToggles();

  // O token vem no endereço (?token=...); sai da barra logo ao carregar para não ficar no histórico.
  const token = new URLSearchParams(window.location.search).get("token");
  history.replaceState(null, "", window.location.pathname);

  const form = document.getElementById("redefinir-form");
  const alertBox = document.getElementById("vs-alert");
  const submitBtn = document.getElementById("submit-btn");
  const mostrar = (id) => {
    ["form-step", "ok-step", "invalido-step"].forEach((s) => document.getElementById(s).classList.toggle("d-none", s !== id));
  };
  if (!token) mostrar("invalido-step");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.add("d-none");
    if (document.getElementById("senha").value !== document.getElementById("senha2").value) {
      alertBox.textContent = "As senhas nao conferem.";
      alertBox.classList.remove("d-none");
      return;
    }
    submitBtn.disabled = true;
    submitBtn.classList.add("is-loading");
    try {
      await Api.redefinirSenha(token, document.getElementById("senha").value);
      mostrar("ok-step");
    } catch (err) {
      if (/link/i.test(err.message || "")) {
        mostrar("invalido-step");
      } else {
        alertBox.textContent = err.message || "Nao foi possivel salvar a senha.";
        alertBox.classList.remove("d-none");
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove("is-loading");
    }
  });
</script>
</body>
</html>
