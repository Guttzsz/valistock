<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Entrar - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div class="vs-auth-wrap">
  <div class="vs-auth-card">
    <div class="vs-auth-logo">
      <div class="vs-brand-mark" style="width:52px;height:52px;font-size:1.2rem;"></div>
      <div>
        <div style="font-weight:800;font-size:1.3rem;">ValiStock</div>
        <div class="vs-muted" style="font-size:0.85rem;">Menos perdas. Mais lucro.</div>
      </div>
    </div>

    <div id="vs-alert" class="alert alert-danger d-none" role="alert"></div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control form-control-lg" id="email" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Senha</label>
        <input type="password" class="form-control form-control-lg" id="senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-vs-primary btn-lg w-100" id="submit-btn">Entrar</button>
    </form>

    <p class="text-center small vs-muted mt-3 mb-0">
      Ainda nao tem conta? <a href="register.html">Cadastre seu estabelecimento</a>
    </p>
    <p class="text-center small vs-muted mt-2 mb-0">
      <a href="cookies.html">Politica de Cookies</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script>
  if (Auth.isAuthenticated()) window.location.href = "dashboard.html";
  VsApplyBrandMarks();
  VsWirePasswordToggles();

  const form = document.getElementById("login-form");
  const alertBox = document.getElementById("vs-alert");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.add("d-none");
    submitBtn.disabled = true;
    submitBtn.classList.add("is-loading");

    try {
      const data = await Api.login({
        email: document.getElementById("email").value.trim(),
        senha: document.getElementById("senha").value,
      });
      Auth.setSession(data.access_token, data.usuario);
      VsTheme.sincronizarComUsuario(data.usuario);

      let destino = "dashboard.html";
      if (data.usuario.perfil === "administrador") {
        try {
          const config = await Api.configuracoes.get();
          if (!config.onboarding_concluido) destino = "onboarding.html";
        } catch (e) {
          // se a checagem falhar, segue para o dashboard normalmente
        }
      }
      window.location.href = destino;
    } catch (err) {
      alertBox.textContent = err.message || "Nao foi possivel entrar.";
      alertBox.classList.remove("d-none");
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove("is-loading");
    }
  });
</script>
</body>
</html>
