<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Localizacoes - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Locais da loja</h1>
      <p>Corredores, geladeiras e outros locais onde seus produtos ficam.</p>
    </div>
    <button class="btn btn-vs-primary" data-bs-toggle="modal" data-bs-target="#modal-local" id="btn-novo">+ Novo local</button>
  </div>

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>
  <div id="vs-lista" class="d-none"></div>
</div>

<div id="vs-bottom-nav"></div>

<div class="modal fade" id="modal-local" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Novo local</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-local">
        <div class="modal-body">
          <input type="hidden" id="local-id">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Nome *</label>
            <input type="text" class="form-control" id="local-nome" required placeholder="Ex: Geladeira 2">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Tipo</label>
            <input type="text" class="form-control" id="local-tipo" placeholder="Ex: geladeira, freezer, corredor">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Descricao</label>
            <textarea class="form-control" id="local-descricao" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-vs-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/localizacoes.js"></script>
</body>
</html>
