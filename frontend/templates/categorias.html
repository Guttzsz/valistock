<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Categorias - ValiStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../static/css/style.css" rel="stylesheet">
<script src="../static/js/theme.js"></script>
</head>
<body>
<div id="vs-topbar" class="vs-topbar"></div>

<div class="vs-container">
  <div class="vs-page-header">
    <div>
      <h1>Categorias</h1>
      <p>Organize seus produtos em categorias.</p>
    </div>
    <button class="btn btn-vs-primary" data-bs-toggle="modal" data-bs-target="#modal-categoria" id="btn-nova">+ Nova categoria</button>
  </div>

  <input type="search" class="form-control mb-3" id="busca" placeholder="Buscar categoria...">

  <div id="vs-loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
  </div>
  <!-- Mobile: cards -->
  <div id="vs-lista" class="d-lg-none d-none"></div>

  <!-- Desktop: table -->
  <div class="vs-table-wrap d-none d-lg-block">
    <table class="vs-table" id="vs-categorias-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Produtos</th>
          <th>Descricao</th>
          <th>Acoes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="vs-bottom-nav"></div>

<div class="modal fade" id="modal-categoria" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Nova categoria</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-categoria">
        <div class="modal-body">
          <input type="hidden" id="categoria-id">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Nome *</label>
            <input type="text" class="form-control" id="categoria-nome" required>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Descricao</label>
            <textarea class="form-control" id="categoria-descricao" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-vs-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api.js"></script>
<script src="../static/js/icons.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/categorias.js"></script>
</body>
</html>
