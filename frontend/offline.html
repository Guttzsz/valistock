<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16a34a">
<title>Sem conexao - ValiStock</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f9; color: #1f2937; padding: 24px; box-sizing: border-box; text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e5e7eb; } }
  .card { max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.35rem; margin: 18px 0 8px; }
  p { margin: 0 0 22px; opacity: 0.8; line-height: 1.5; }
  button {
    background: #16a34a; color: #fff; border: 0; border-radius: 10px;
    padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div class="card">
  <img src="/static/icons/icon-192.png" alt="ValiStock">
  <h1>Voce esta sem internet</h1>
  <p>O ValiStock precisa de conexao para mostrar seus produtos e validades. Assim que a internet voltar, e so tentar de novo.</p>
  <button type="button" onclick="location.reload()">Tentar novamente</button>
</div>
</body>
</html>
