services:
  db:
    image: postgres:16-alpine
    container_name: valistock_db
    environment:
      POSTGRES_USER: valistock
      POSTGRES_PASSWORD: valistock
      POSTGRES_DB: valistock
    ports:
      - "5432:5432"
    volumes:
      - valistock_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valistock"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: valistock_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://valistock:valistock@db:5432/valistock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  valistock_db_data:
