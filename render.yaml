services:
  - type: web
    name: valistock-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: https://valistock.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ESSENCIAL
        sync: false
      - key: STRIPE_PRICE_PROFISSIONAL
        sync: false
      - key: STRIPE_PRICE_EMPRESA
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://valistock.vercel.app/templates/planos.html?status=success
      - key: STRIPE_CANCEL_URL
        value: https://valistock.vercel.app/templates/planos.html?status=cancel
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false
