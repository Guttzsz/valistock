# O plano free do Render dorme o servico apos ~15 min sem requisicoes, e o APScheduler (alertas
# diarios de validade as 06:00) so roda com o processo acordado. Este ping o mantem ativo.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 20 https://valistock-backend.onrender.com/health
